# Broken Divinity Kernel — Default Configuration
# Copy this to ~/.config/broken-divinity/config.toml and edit

theme_id = "bd_default"
log_level = "bd=info"
debug_flags = []

[keybindings]
move_north = "w"
move_south = "s"
move_east = "d"
move_west = "a"
wait = "."
rest_until_next_day = "n"
attack = "f"
guard = "g"
inventory = "i"
pickup = "p"
extract = "r"
use_item = "u"
help = "?"
travel = "t"
build = "b"
assign_task = "c"
assign_station = "e"
save = "F5"
load = "F9"
quit = "q"
